<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice & Contract Builder — Tripp Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0a0a; --panel:#141414; --accent:#FF6B00; --text:#f2f2f2; --dim:#9a9a9a; --border:#262626; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:60px;}
  .nav{background:rgba(10,10,10,0.95);border-bottom:1px solid var(--border);padding:0 20px;}
  .nav-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;height:56px;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:#fff;text-decoration:none;}
  .logo .accent{color:var(--accent);}
  .saved-tag{color:var(--dim);font-size:12px;}

  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:1px;margin-bottom:4px;}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{background:var(--panel);border:1px solid var(--border);color:var(--dim);padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .doc-panel{display:none;}
  .doc-panel.active{display:block;}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:900px){.split{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
  .card h3{font-size:13px;margin-bottom:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;}
  .field{margin-bottom:12px;}
  .field label{font-size:12px;color:var(--dim);display:block;margin-bottom:5px;}
  .field input, .field textarea{width:100%;background:#0a0a0a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;}
  .field textarea{min-height:70px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .line-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .line-row input{background:#0a0a0a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px;}
  .del-btn{background:none;border:none;color:#555;cursor:pointer;font-size:14px;}
  .add-line-btn{background:transparent;border:1px dashed var(--border);color:var(--dim);border-radius:6px;padding:8px;width:100%;cursor:pointer;font-size:12px;margin-top:8px;}

  .preview-wrap{position:sticky;top:20px;}
  .preview{background:#fff;color:#1a1a1a;border-radius:8px;padding:36px;font-family:'Merriweather',serif;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
  .preview h1{font-family:'Merriweather',serif;font-size:1.6rem;color:#1a1a1a;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px;}
  .preview h2{font-size:1.05rem;color:var(--accent);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
  .preview p{font-size:0.88rem;line-height:1.6;color:#333;margin-bottom:8px;}
  .preview table{width:100%;border-collapse:collapse;margin-top:6px;font-size:0.85rem;}
  .preview td{padding:6px;border-bottom:1px solid #eee;}
  .preview .total-row td{font-weight:700;border-top:2px solid #333;}
  .sig-line{border-bottom:1px solid #333;width:250px;display:inline-block;margin-top:20px;}

  .add-btn{background:var(--accent);color:#000;border:none;border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:14px;width:100%;}

  @media print{
    body *{visibility:hidden;}
    .preview, .preview *{visibility:visible;}
    .preview{position:absolute;left:0;top:0;width:100%;box-shadow:none;max-height:none;overflow:visible;}
  }
</style>
</head>
<body>

<nav class="nav"><div class="nav-inner">
  <a href="#" class="logo">TRIPP <span class="accent">DIGITAL</span></a>
  <span class="saved-tag" id="savedTag">Saved in this browser</span>
</div></nav>

<div class="wrap">
  <h1>Invoice & Contract Builder</h1>
  <p class="sub">Everything saves automatically. Switch tabs anytime — export as PDF when ready.</p>

  <div class="tabs">
    <div class="tab active" data-doc="invoice">🧾 Invoice</div>
    <div class="tab" data-doc="contract">📄 Contract</div>
  </div>

  <!-- INVOICE -->
  <div class="doc-panel active" id="doc-invoice">
    <div class="split">
      <div>
        <div class="card">
          <h3>Your Business</h3>
          <div class="row2">
            <div class="field"><label>Business Name</label><input type="text" id="iBiz" oninput="update()"></div>
            <div class="field"><label>Invoice #</label><input type="text" id="iNum" oninput="update()"></div>
          </div>
          <div class="field"><label>Bill To</label><input type="text" id="iClient" oninput="update()"></div>
        </div>
        <div class="card">
          <h3>Line Items</h3>
          <div id="invLines"></div>
          <button class="add-line-btn" onclick="addInvLine()">+ Add Line Item</button>
        </div>
        <div class="card">
          <h3>Export</h3>
          <button class="add-btn" onclick="window.print()">🖨️ Export as PDF (Print)</button>
        </div>
      </div>
      <div class="preview-wrap">
        <div class="preview" id="invPreview"></div>
      </div>
    </div>
  </div>

  <!-- CONTRACT -->
  <div class="doc-panel" id="doc-contract">
    <div class="split">
      <div>
        <div class="card">
          <h3>Parties</h3>
          <div class="row2">
            <div class="field"><label>Service Provider</label><input type="text" id="cProvider" oninput="update()"></div>
            <div class="field"><label>Client</label><input type="text" id="cClient" oninput="update()"></div>
          </div>
        </div>
        <div class="card">
          <h3>Scope of Work</h3>
          <div class="field"><textarea id="cScope" oninput="update()"></textarea></div>
        </div>
        <div class="card">
          <h3>Payment Terms</h3>
          <div class="row2">
            <div class="field"><label>Total Fee</label><input type="text" id="cFee" oninput="update()"></div>
            <div class="field"><label>Due Date</label><input type="text" id="cDue" oninput="update()"></div>
          </div>
        </div>
        <div class="card">
          <h3>Additional Clauses</h3>
          <div class="field"><textarea id="cClauses" oninput="update()"></textarea></div>
        </div>
        <div class="card">
          <h3>Export</h3>
          <button class="add-btn" onclick="window.print()">🖨️ Export as PDF (Print)</button>
        </div>
      </div>
      <div class="preview-wrap">
        <div class="preview" id="contractPreview"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const FIELDS = ['iBiz','iNum','iClient','cProvider','cClient','cScope','cFee','cDue','cClauses'];
  const STORAGE_KEY = 'invoice_contract_data';
  let invLines = [];
  let activeDoc = 'invoice';

  function save(){
    const data = {};
    FIELDS.forEach(id => data[id] = document.getElementById(id).value);
    data.invLines = invLines;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function load(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      document.getElementById('iBiz').value = "Your Business Name";
      document.getElementById('iNum').value = "INV-1001";
      document.getElementById('iClient').value = "Client Name";
      document.getElementById('cProvider').value = "Your Business Name";
      document.getElementById('cClient').value = "Client Name";
      document.getElementById('cScope').value = "Describe the work you'll be doing.";
      document.getElementById('cFee').value = "$2,500";
      document.getElementById('cDue').value = "Net 15";
      document.getElementById('cClauses').value = "This agreement may be terminated by either party with 14 days written notice.";
      invLines = [ { desc: "Service or product", qty: 1, rate: 0 } ];
      return;
    }
    try{
      const data = JSON.parse(raw);
      FIELDS.forEach(id => { if(data[id] !== undefined) document.getElementById(id).value = data[id]; });
      invLines = data.invLines || [];
    }catch(e){}
  }

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.doc-panel').forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('doc-'+tab.dataset.doc).classList.add('active');
      activeDoc = tab.dataset.doc;
    });
  });

  function renderInvLines(){
    document.getElementById('invLines').innerHTML = invLines.map((l,i)=>`
      <div class="line-row">
        <input type="text" value="${l.desc}" onchange="updateInvLine(${i},'desc',this.value)">
        <input type="number" value="${l.qty}" onchange="updateInvLine(${i},'qty',this.value)" placeholder="Qty">
        <input type="number" value="${l.rate}" onchange="updateInvLine(${i},'rate',this.value)" placeholder="Rate">
        <button class="del-btn" onclick="removeInvLine(${i})">✕</button>
      </div>`).join('');
  }
  function updateInvLine(i,f,v){ invLines[i][f] = f==='desc'?v:parseFloat(v)||0; update(); }
  function addInvLine(){ invLines.push({desc:"New item",qty:1,rate:0}); renderInvLines(); update(); }
  function removeInvLine(i){ invLines.splice(i,1); renderInvLines(); update(); }

  function update(){
    const v = id => document.getElementById(id).value || '—';
    const total = invLines.reduce((s,l)=>s+(l.qty*l.rate),0);

    document.getElementById('invPreview').innerHTML = `
      <h1>Invoice ${v('iNum')}</h1>
      <p style="color:#888;">From: ${v('iBiz')} · To: ${v('iClient')}</p>
      <table>
        <tr><th style="text-align:left;">Item</th><th>Qty</th><th>Rate</th><th style="text-align:right;">Amount</th></tr>
        ${invLines.map(l=>`<tr><td>${l.desc}</td><td>${l.qty}</td><td>$${l.rate}</td><td style="text-align:right;">$${(l.qty*l.rate).toLocaleString()}</td></tr>`).join('')}
        <tr class="total-row"><td colspan="3">Total Due</td><td style="text-align:right;">$${total.toLocaleString()}</td></tr>
      </table>
    `;

    document.getElementById('contractPreview').innerHTML = `
      <h1>Service Agreement</h1>
      <p style="color:#888;">Between ${v('cProvider')} and ${v('cClient')}</p>
      <h2>Scope of Work</h2><p>${v('cScope')}</p>
      <h2>Payment Terms</h2><p>Total Fee: ${v('cFee')} · Due: ${v('cDue')}</p>
      <h2>Additional Clauses</h2><p>${v('cClauses')}</p>
      <h2>Signatures</h2>
      <p><span class="sig-line"></span><br>Provider Signature · Date</p>
      <p><span class="sig-line"></span><br>Client Signature · Date</p>
    `;
    save();
    const tag = document.getElementById('savedTag');
    tag.textContent = 'Saved ✓';
    clearTimeout(window._savedTimeout);
    window._savedTimeout = setTimeout(()=>{ tag.textContent = 'Saved in this browser'; }, 1500);
  }

  load();
  renderInvLines();
  update();
</script>

    <!-- CHATBOT STYLES (inlined from styles.css for pages that do not link it) -->
    <style>
.chatbot-widget, .chatbot-toggle {
    --color-bg: #0a0a0a;
    --color-bg-secondary: #1a1a1a;
    --color-orange: #FF6B00;
    --color-orange-dark: #e55a00;
    --color-text: #ffffff;
    --color-text-muted: #b0b0b0;
    --font-heading: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --transition: all 0.3s ease;
}
/* CHATBOT STYLES */
.chatbot-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: var(--color-orange);
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
    transition: var(--transition);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-toggle svg {
    width: 28px;
    height: 28px;
    stroke: #000;
    flex-shrink: 0;
}

.chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 30px rgba(255, 107, 0, 0.6);
}

.chatbot-toggle.hidden {
    display: none;
}

.chatbot-widget {
    position: fixed;
    bottom: 100px;
    right: 30px;
    width: 400px;
    max-width: 90vw;
    height: 600px;
    background-color: var(--color-bg-secondary);
    border: 2px solid var(--color-orange);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    z-index: 998;
    animation: slideUp 0.3s ease;
    display: none;
}

.chatbot-widget.open {
    display: flex;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chatbot-header {
    background-color: var(--color-orange);
    color: #000;
    padding: 15px 20px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
}

.chatbot-header h3 {
    font-size: 1.1rem;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.chatbot-close {
    background: none;
    border: none;
    color: #000;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.chatbot-close:hover {
    transform: scale(1.2);
}

.chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.chatbot-messages::-webkit-scrollbar {
    width: 6px;
}

.chatbot-messages::-webkit-scrollbar-track {
    background: var(--color-bg);
    border-radius: 10px;
}

.chatbot-messages::-webkit-scrollbar-thumb {
    background: var(--color-orange);
    border-radius: 10px;
}

.chat-message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-message.user {
    justify-content: flex-end;
}

.chat-message.assistant {
    justify-content: flex-start;
}

.chat-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 0.95rem;
}

.chat-message.user .chat-bubble {
    background-color: var(--color-orange);
    color: #000;
    font-weight: 500;
}

.chat-message.assistant .chat-bubble {
    background-color: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-bg-secondary);
}

.chat-message.system .chat-bubble {
    background-color: transparent;
    color: var(--color-text-muted);
    text-align: center;
    font-size: 0.85rem;
}

.chatbot-input-area {
    padding: 15px;
    border-top: 1px solid var(--color-bg);
}

.chatbot-input-area form {
    display: flex;
    gap: 10px;
}

.chatbot-input-area input {
    flex: 1;
    padding: 10px 15px;
    background-color: var(--color-bg);
    border: 1px solid var(--color-bg-secondary);
    border-radius: 6px;
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    transition: var(--transition);
}

.chatbot-input-area input:focus {
    outline: none;
    border-color: var(--color-orange);
}

.chatbot-input-area input::placeholder {
    color: var(--color-text-muted);
}

.chatbot-send {
    width: 40px;
    height: 40px;
    background-color: var(--color-orange);
    border: none;
    border-radius: 6px;
    color: #000;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-weight: 700;
}

.chatbot-send:hover {
    background-color: var(--color-orange-dark);
    transform: scale(1.05);
}

.chatbot-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.loading-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
}

.loading-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--color-orange);
    animation: bounce 1.4s infinite;
}

.loading-dot:nth-child(1) { animation-delay: 0s; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
    </style>

    <!-- CHATBOT WIDGET -->
    <div id="chatbotWidget" class="chatbot-widget">
        <div class="chatbot-header">
            <h3>Tripp Digital Assistant</h3>
            <button id="closeChatbot" class="chatbot-close">&times;</button>
        </div>
        <div id="chatMessages" class="chatbot-messages"></div>
        <div class="chatbot-input-area">
            <form id="chatForm">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="Ask about our services, products, or anything else..."
                    autocomplete="off"
                >
                <button type="submit" class="chatbot-send">→</button>
            </form>
        </div>
    </div>

    <!-- CHATBOT TOGGLE BUTTON -->
    <button id="chatbotToggle" class="chatbot-toggle" title="Chat with us">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" width="28" height="28"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <script src="chatbot.js"></script>
</body>
</html>
