<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Little Learners — Daycare Tracker</title>
<style>
  :root{
    --teal:#0E8388;
    --teal-dark:#095C5F;
    --coral:#FF7A5C;
    --coral-light:#FFE8E2;
    --yellow:#FFC145;
    --bg:#F7FAF9;
    --card:#FFFFFF;
    --text:#1E2A2B;
    --grey:#7C8B8C;
    --line:#E7EEED;
    --green:#3AA655;
    --red:#E15C5C;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:78px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}

  /* Header */
  .header{background:var(--teal);color:#fff;padding:18px 18px 22px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:20;}
  .header-top{display:flex;justify-content:space-between;align-items:center;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{width:36px;height:36px;border-radius:10px;background:var(--yellow);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;overflow:hidden;}
  .brand-logo img{width:100%;height:100%;object-fit:cover;}
  .brand-name{font-weight:700;font-size:17px;}
  .brand-sub{font-size:11.5px;color:#CDEDEC;}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
  .header-stats{display:flex;gap:10px;margin-top:16px;overflow-x:auto;scrollbar-width:none;}
  .header-stats::-webkit-scrollbar{display:none;}
  .stat-pill{background:rgba(255,255,255,0.14);border-radius:14px;padding:10px 14px;min-width:92px;flex-shrink:0;}
  .stat-pill .num{font-size:19px;font-weight:800;line-height:1.1;}
  .stat-pill .lbl{font-size:10.5px;color:#CDEDEC;margin-top:2px;}

  /* Search / filter bar */
  .toolbar{padding:14px 16px 4px;display:flex;gap:8px;}
  .search{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--grey);}
  .search input{border:none;outline:none;font-size:14px;flex:1;background:transparent;color:var(--text);}
  .filter-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

  .chips{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--grey);white-space:nowrap;flex-shrink:0;}
  .chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  /* Roster cards */
  .roster{padding:14px 16px 10px;display:flex;flex-direction:column;gap:12px;}
  .child-card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(20,50,50,0.06);}
  .child-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .child-id{display:flex;gap:10px;align-items:center;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--coral-light);color:var(--coral);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
  .child-name{font-size:15.5px;font-weight:700;}
  .child-parent{font-size:12px;color:var(--grey);margin-top:1px;}
  .kebab{font-size:18px;color:var(--grey);padding:4px 8px;}

  .pill-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .pill.enrolled{background:#E4F6E8;color:var(--green);}
  .pill.waitlist{background:#FFF3D6;color:#B8860B;}
  .pill.withdrawn{background:#F1F1F1;color:var(--grey);}
  .pill.paid{background:#E4F6E8;color:var(--green);}
  .pill.pending{background:#FFF3D6;color:#B8860B;}
  .pill.overdue{background:#FDE7E7;color:var(--red);}

  .child-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .tuition{font-size:15px;font-weight:800;color:var(--teal-dark);}
  .tuition span{font-size:11px;font-weight:500;color:var(--grey);}
  .attend-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;background:var(--bg);border:1.5px solid var(--line);color:var(--grey);}
  .attend-btn.checked{background:var(--teal);border-color:var(--teal);color:#fff;}

  .empty{text-align:center;padding:60px 30px;color:var(--grey);}
  .empty .big{font-size:40px;margin-bottom:10px;}

  /* FAB */
  .fab{position:fixed;bottom:88px;right:20px;width:58px;height:58px;border-radius:50%;background:var(--coral);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,122,92,0.45);z-index:30;}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--grey);font-size:10.5px;font-weight:600;}
  .nav-item .ic{font-size:19px;}
  .nav-item.active{color:var(--teal);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,35,35,0.45);display:none;align-items:flex-end;z-index:100;}
  .overlay.show{display:flex;}
  .sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;padding:8px 20px 26px;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:38px;height:4px;background:var(--line);border-radius:4px;margin:8px auto 14px;}
  .sheet-title{font-size:18px;font-weight:800;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--grey);display:block;margin-bottom:6px;}
  .field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px;background:var(--bg);color:var(--text);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:14px;border-radius:14px;font-size:14.5px;font-weight:700;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--line);}
  .btn-danger{background:#FDE7E7;color:var(--red);}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1E2A2B;color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-logo" id="logoBox">LL</div>
      <div>
        <div class="brand-name" id="brandName">Little Learners</div>
        <div class="brand-sub">Enrollment &amp; Billing</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
  <div class="header-stats">
    <div class="stat-pill"><div class="num" id="statTotal">0</div><div class="lbl">Total Kids</div></div>
    <div class="stat-pill"><div class="num" id="statEnrolled">0</div><div class="lbl">Enrolled</div></div>
    <div class="stat-pill"><div class="num" id="statWaitlist">0</div><div class="lbl">Waitlist</div></div>
    <div class="stat-pill"><div class="num" id="statRevenue">$0</div><div class="lbl">Monthly Rev</div></div>
  </div>
</div>

<div class="toolbar">
  <div class="search">🔍<input id="searchInput" placeholder="Search children..." oninput="render()"></div>
  <button class="filter-btn" onclick="cycleSort()">↕️</button>
</div>

<div class="chips" id="statusChips">
  <button class="chip active" data-f="all" onclick="setFilter('all')">All</button>
  <button class="chip" data-f="Enrolled" onclick="setFilter('Enrolled')">Enrolled</button>
  <button class="chip" data-f="Waitlist" onclick="setFilter('Waitlist')">Waitlist</button>
  <button class="chip" data-f="Withdrawn" onclick="setFilter('Withdrawn')">Withdrawn</button>
  <button class="chip" data-f="Overdue" onclick="setFilter('Overdue')">Payment Due</button>
</div>

<div class="roster" id="roster"></div>

<button class="fab" onclick="openChildModal()">+</button>

<div class="bottom-nav">
  <div class="nav-item active"><div class="ic">🏠</div>Roster</div>
  <div class="nav-item" onclick="exportCSV()"><div class="ic">📤</div>Export</div>
  <div class="nav-item" onclick="openSettings()"><div class="ic">⚙️</div>Settings</div>
</div>

<!-- Child Modal -->
<div class="overlay" id="childOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="childModalTitle">Add Child</div>
    <input type="hidden" id="childId">
    <div class="field"><label>Child's Name</label><input id="cName" placeholder="e.g. Ava Johnson"></div>
    <div class="field"><label>Parent / Guardian</label><input id="cParent" placeholder="e.g. Maria Johnson"></div>
    <div class="field"><label>Phone</label><input id="cPhone" placeholder="(757) 555-0123"></div>
    <div class="field-row">
      <div class="field"><label>Enrollment Date</label><input type="date" id="cDate"></div>
      <div class="field"><label>Monthly Tuition</label><input type="number" id="cTuition" placeholder="850"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Enrollment Status</label>
        <select id="cStatus">
          <option>Enrolled</option><option>Waitlist</option><option>Withdrawn</option>
        </select>
      </div>
      <div class="field"><label>Payment Status</label>
        <select id="cPayment">
          <option>Paid</option><option>Pending</option><option>Overdue</option>
        </select>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeModal('childOverlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveChild()">Save Child</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger" onclick="deleteChild()">Delete Child</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Settings</div>
    <div class="field"><label>Daycare / Business Name</label><input id="sName" placeholder="Little Learners"></div>
    <div class="field"><label>Logo Initials (2 letters)</label><input id="sLogo" maxlength="2" placeholder="LL"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeModal('settingsOverlay')">Close</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger" onclick="clearAll()">Clear All Data</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CKEY='ll_children', SKEY='ll_settings';
let children = JSON.parse(localStorage.getItem(CKEY) || 'null') || [
  {id:1, name:'Ava Johnson', parent:'Maria Johnson', phone:'(757) 555-0123', date:'2026-01-10', tuition:850, status:'Enrolled', payment:'Paid', attendedToday:true},
  {id:2, name:'Liam Carter', parent:'James Carter', phone:'(757) 555-0456', date:'2026-02-01', tuition:900, status:'Enrolled', payment:'Overdue', attendedToday:false},
  {id:3, name:'Noah Bell', parent:'Kim Bell', phone:'(757) 555-0789', date:'2026-03-15', tuition:800, status:'Waitlist', payment:'Pending', attendedToday:false}
];
let settings = JSON.parse(localStorage.getItem(SKEY) || 'null') || {name:'Little Learners', logo:'LL'};
let filter = 'all';
let sortMode = 0; // 0 name, 1 tuition desc

function save(){ localStorage.setItem(CKEY, JSON.stringify(children)); localStorage.setItem(SKEY, JSON.stringify(settings)); }

function initials(name){ return name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }

function setFilter(f){
  filter = f;
  document.querySelectorAll('#statusChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  render();
}

function cycleSort(){
  sortMode = (sortMode+1) % 2;
  showToast(sortMode===0 ? 'Sorted by name' : 'Sorted by tuition');
  render();
}

function render(){
  document.getElementById('brandName').textContent = settings.name;
  document.getElementById('logoBox').textContent = settings.logo;

  const enrolled = children.filter(c=>c.status==='Enrolled');
  document.getElementById('statTotal').textContent = children.length;
  document.getElementById('statEnrolled').textContent = enrolled.length;
  document.getElementById('statWaitlist').textContent = children.filter(c=>c.status==='Waitlist').length;
  const revenue = enrolled.reduce((s,c)=>s+Number(c.tuition||0),0);
  document.getElementById('statRevenue').textContent = '$'+revenue.toLocaleString();

  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = children.filter(c=>{
    const matchesSearch = c.name.toLowerCase().includes(q) || c.parent.toLowerCase().includes(q);
    const matchesFilter = filter==='all' ? true : (filter==='Overdue' ? c.payment==='Overdue' : c.status===filter);
    return matchesSearch && matchesFilter;
  });
  list.sort((a,b)=> sortMode===0 ? a.name.localeCompare(b.name) : b.tuition-a.tuition);

  const roster = document.getElementById('roster');
  if(list.length===0){
    roster.innerHTML = '<div class="empty"><div class="big">🧸</div>No children found.<br>Tap the + button to add one.</div>';
    return;
  }

  roster.innerHTML = list.map(c=>`
    <div class="child-card">
      <div class="child-top">
        <div class="child-id">
          <div class="avatar">${initials(c.name)}</div>
          <div>
            <div class="child-name">${c.name}</div>
            <div class="child-parent">${c.parent} · ${c.phone||'—'}</div>
          </div>
        </div>
        <button class="kebab" onclick="openChildModal(${c.id})">⋯</button>
      </div>
      <div class="pill-row">
        <span class="pill ${c.status.toLowerCase()}">${c.status}</span>
        <span class="pill ${c.payment.toLowerCase()}">${c.payment}</span>
      </div>
      <div class="child-bottom">
        <div class="tuition">$${Number(c.tuition).toLocaleString()}<span>/mo</span></div>
        <button class="attend-btn ${c.attendedToday?'checked':''}" onclick="toggleAttendance(${c.id})">
          ${c.attendedToday ? '✓ Here Today' : 'Mark Present'}
        </button>
      </div>
    </div>
  `).join('');
}

function toggleAttendance(id){
  const c = children.find(x=>x.id===id);
  c.attendedToday = !c.attendedToday;
  save(); render();
  showToast(c.attendedToday ? c.name+' marked present' : 'Attendance unmarked');
}

function openChildModal(id){
  document.getElementById('childId').value = id || '';
  document.getElementById('deleteRow').style.display = id ? 'flex' : 'none';
  if(id){
    const c = children.find(x=>x.id===id);
    document.getElementById('childModalTitle').textContent = 'Edit Child';
    document.getElementById('cName').value = c.name;
    document.getElementById('cParent').value = c.parent;
    document.getElementById('cPhone').value = c.phone;
    document.getElementById('cDate').value = c.date;
    document.getElementById('cTuition').value = c.tuition;
    document.getElementById('cStatus').value = c.status;
    document.getElementById('cPayment').value = c.payment;
  } else {
    document.getElementById('childModalTitle').textContent = 'Add Child';
    ['cName','cParent','cPhone','cDate'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('cTuition').value = '';
    document.getElementById('cStatus').value = 'Enrolled';
    document.getElementById('cPayment').value = 'Pending';
  }
  document.getElementById('childOverlay').classList.add('show');
}

function saveChild(){
  const name = document.getElementById('cName').value.trim();
  if(!name){ showToast('Please enter a name'); return; }
  const id = document.getElementById('childId').value;
  const data = {
    name,
    parent: document.getElementById('cParent').value.trim(),
    phone: document.getElementById('cPhone').value.trim(),
    date: document.getElementById('cDate').value,
    tuition: Number(document.getElementById('cTuition').value)||0,
    status: document.getElementById('cStatus').value,
    payment: document.getElementById('cPayment').value
  };
  if(id){
    const c = children.find(x=>x.id==id);
    Object.assign(c, data);
    showToast('Child updated');
  } else {
    data.id = Date.now();
    data.attendedToday = false;
    children.push(data);
    showToast('Child added');
  }
  save(); closeModal('childOverlay'); render();
}

function deleteChild(){
  const id = Number(document.getElementById('childId').value);
  if(!confirm('Remove this child from the roster?')) return;
  children = children.filter(c=>c.id!==id);
  save(); closeModal('childOverlay'); render();
  showToast('Child removed');
}

function openSettings(){
  document.getElementById('sName').value = settings.name;
  document.getElementById('sLogo').value = settings.logo;
  document.getElementById('settingsOverlay').classList.add('show');
}
function saveSettings(){
  settings.name = document.getElementById('sName').value.trim() || 'Little Learners';
  settings.logo = (document.getElementById('sLogo').value.trim() || 'LL').toUpperCase();
  save(); closeModal('settingsOverlay'); render();
  showToast('Settings saved');
}
function clearAll(){
  if(!confirm('This will erase every child and reset settings. Continue?')) return;
  localStorage.removeItem(CKEY); localStorage.removeItem(SKEY);
  children=[]; settings={name:'Little Learners', logo:'LL'};
  closeModal('settingsOverlay'); render();
  showToast('All data cleared');
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function exportCSV(){
  const rows = [['Name','Parent','Phone','Enrollment Date','Tuition','Status','Payment','Attended Today']];
  children.forEach(c=>rows.push([c.name,c.parent,c.phone,c.date,c.tuition,c.status,c.payment,c.attendedToday?'Yes':'No']));
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'daycare-roster.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

document.getElementById('childOverlay').addEventListener('click', e=>{ if(e.target.id==='childOverlay') closeModal('childOverlay'); });
document.getElementById('settingsOverlay').addEventListener('click', e=>{ if(e.target.id==='settingsOverlay') closeModal('settingsOverlay'); });

render();
</script>
<script src="/app-status-check.js" data-app="daycare-tracker"></script>
</body>
</html>
