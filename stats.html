<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tripp Digital - Site Stats</title>
<style>
  body { background:#0D0D0D; color:#f5f5f5; font-family: -apple-system, Arial, sans-serif; padding: 30px; }
  h1 { color:#FF6B00; }
  .card { background:#1a1a1a; border-radius:12px; padding:20px; margin-bottom:20px; }
  .big { font-size: 48px; font-weight:bold; color:#FF6B00; }
  table { width:100%; border-collapse: collapse; margin-top:10px; }
  td, th { padding:8px; border-bottom:1px solid #333; text-align:left; }
  input { padding:10px; border-radius:8px; border:1px solid #333; background:#000; color:#fff; width: 250px; }
  button { padding:10px 16px; border-radius:8px; border:none; background:#FF6B00; color:#000; font-weight:bold; cursor:pointer; margin-left:8px; }
  #dash { display:none; }
</style>
</head>
<body>
  <h1>TRIPP DIGITAL — Site Stats</h1>

  <div id="login">
    <input id="key" type="password" placeholder="Enter passcode">
    <button onclick="load()">View Stats</button>
  </div>

  <div id="dash">
    <div class="card">
      <div>All-time visits</div>
      <div class="big" id="total">-</div>
    </div>

    <div class="card">
      <div>Last 14 days</div>
      <table><tbody id="daily"></tbody></table>
    </div>

    <div class="card">
      <div>Top pages (last 14 days)</div>
      <table><tbody id="pages"></tbody></table>
    </div>

    <div class="card">
      <div>Top referrers (last 14 days)</div>
      <table><tbody id="refs"></tbody></table>
    </div>

    <div class="card">
      <div>Device breakdown</div>
      <table><tbody id="devices"></tbody></table>
    </div>
  </div>

<script>
async function load() {
  const key = document.getElementById('key').value;
  const res = await fetch('/.netlify/functions/get-stats?key=' + encodeURIComponent(key));
  if (!res.ok) { alert('Wrong passcode'); return; }
  const data = await res.json();

  document.getElementById('login').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  document.getElementById('total').textContent = data.total;

  document.getElementById('daily').innerHTML = data.last14Days
    .map(d => `<tr><td>${d.date}</td><td>${d.count}</td></tr>`).join('');

  document.getElementById('pages').innerHTML = Object.entries(data.topPages)
    .sort((a,b)=>b[1]-a[1])
    .map(([p,c]) => `<tr><td>${p}</td><td>${c}</td></tr>`).join('');

  document.getElementById('refs').innerHTML = Object.entries(data.topReferrers)
    .sort((a,b)=>b[1]-a[1])
    .map(([r,c]) => `<tr><td>${r}</td><td>${c}</td></tr>`).join('');

  document.getElementById('devices').innerHTML = Object.entries(data.deviceCounts)
    .map(([d,c]) => `<tr><td>${d}</td><td>${c}</td></tr>`).join('');
}
</script>
</body>
</html>
