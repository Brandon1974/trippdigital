<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tools — Tripp Digital</title>
	<style>
		:root { --accent: #FF6B00; }
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
		.container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
		h1 { font-size: 2.5rem; margin-bottom: 40px; }
		.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
		.tool-card { background: #0a0a0a; border: 1px solid #222; padding: 30px; border-radius: 8px; text-decoration: none; color: #fff; transition: all 0.2s; }
		.tool-card:hover { border-color: var(--accent); transform: translateY(-4px); }
		.tool-card h3 { color: var(--accent); margin-bottom: 12px; }
		.tool-card p { color: #b0b0b0; font-size: 0.95rem; margin-bottom: 20px; }
		.btn { background: var(--accent); color: #000; padding: 12px 24px; border-radius: 4px; font-weight: 600; display: inline-block; text-decoration: none; }
		.btn:hover { background: #e55a00; }
	</style>
</head>
<body>
	<div class="container">
		<h1>🛠️ Tripp Digital Tools</h1>

		<div class="tools">
			<a href="./lead-finder.html" class="tool-card">
				<h3>Lead Finder</h3>
				<p>Search for local businesses by type and location. Find prospects who need websites and track your outreach.</p>
				<span class="btn">Open Tool →</span>
			</a>

			<a href="./lead-crm-tracker.html" class="tool-card">
				<h3>Lead & CRM Tracker</h3>
				<p>Manage your sales pipeline with unlimited leads, metrics, and CSV export.</p>
				<span class="btn">Open Tool →</span>
			</a>
		</div>
	</div>
    <!-- Visitor tracker -->
    <script>
      fetch("/.netlify/functions/track-visit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          page: window.location.pathname,
          referrer: document.referrer || "direct"
        })
      }).catch(() => {});
    </script>
    <!-- CHATBOT STYLES (inlined from styles.css for pages that do not link it) -->
    <style>
.chatbot-widget, .chatbot-toggle {
    --color-bg: #0a0a0a;
    --color-bg-secondary: #1a1a1a;
    --color-orange: #FF6B00;
    --color-orange-dark: #e55a00;
    --color-text: #ffffff;
    --color-text-muted: #b0b0b0;
    --font-heading: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --transition: all 0.3s ease;
}
/* CHATBOT STYLES */
.chatbot-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: var(--color-orange);
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
    transition: var(--transition);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-toggle svg {
    width: 28px;
    height: 28px;
    stroke: #000;
    flex-shrink: 0;
}

.chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 30px rgba(255, 107, 0, 0.6);
}

.chatbot-toggle.hidden {
    display: none;
}

.chatbot-widget {
    position: fixed;
    bottom: 100px;
    right: 30px;
    width: 400px;
    max-width: 90vw;
    height: 600px;
    background-color: var(--color-bg-secondary);
    border: 2px solid var(--color-orange);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    z-index: 998;
    animation: slideUp 0.3s ease;
    display: none;
}

.chatbot-widget.open {
    display: flex;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chatbot-header {
    background-color: var(--color-orange);
    color: #000;
    padding: 15px 20px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
}

.chatbot-header h3 {
    font-size: 1.1rem;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.chatbot-close {
    background: none;
    border: none;
    color: #000;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.chatbot-close:hover {
    transform: scale(1.2);
}

.chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.chatbot-messages::-webkit-scrollbar {
    width: 6px;
}

.chatbot-messages::-webkit-scrollbar-track {
    background: var(--color-bg);
    border-radius: 10px;
}

.chatbot-messages::-webkit-scrollbar-thumb {
    background: var(--color-orange);
    border-radius: 10px;
}

.chat-message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-message.user {
    justify-content: flex-end;
}

.chat-message.assistant {
    justify-content: flex-start;
}

.chat-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 0.95rem;
}

.chat-message.user .chat-bubble {
    background-color: var(--color-orange);
    color: #000;
    font-weight: 500;
}

.chat-message.assistant .chat-bubble {
    background-color: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-bg-secondary);
}

.chat-message.system .chat-bubble {
    background-color: transparent;
    color: var(--color-text-muted);
    text-align: center;
    font-size: 0.85rem;
}

.chatbot-input-area {
    padding: 15px;
    border-top: 1px solid var(--color-bg);
}

.chatbot-input-area form {
    display: flex;
    gap: 10px;
}

.chatbot-input-area input {
    flex: 1;
    padding: 10px 15px;
    background-color: var(--color-bg);
    border: 1px solid var(--color-bg-secondary);
    border-radius: 6px;
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    transition: var(--transition);
}

.chatbot-input-area input:focus {
    outline: none;
    border-color: var(--color-orange);
}

.chatbot-input-area input::placeholder {
    color: var(--color-text-muted);
}

.chatbot-send {
    width: 40px;
    height: 40px;
    background-color: var(--color-orange);
    border: none;
    border-radius: 6px;
    color: #000;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-weight: 700;
}

.chatbot-send:hover {
    background-color: var(--color-orange-dark);
    transform: scale(1.05);
}

.chatbot-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.loading-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
}

.loading-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--color-orange);
    animation: bounce 1.4s infinite;
}

.loading-dot:nth-child(1) { animation-delay: 0s; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
    </style>

    <!-- CHATBOT WIDGET -->
    <div id="chatbotWidget" class="chatbot-widget">
        <div class="chatbot-header">
            <h3>Tripp Digital Assistant</h3>
            <button id="closeChatbot" class="chatbot-close">&times;</button>
        </div>
        <div id="chatMessages" class="chatbot-messages"></div>
        <div class="chatbot-input-area">
            <form id="chatForm">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="Ask about our services, products, or anything else..."
                    autocomplete="off"
                >
                <button type="submit" class="chatbot-send">→</button>
            </form>
        </div>
    </div>

    <!-- CHATBOT TOGGLE BUTTON -->
    <button id="chatbotToggle" class="chatbot-toggle" title="Chat with us">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" width="28" height="28"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <script src="chatbot.js"></script>
</body>
</html>
