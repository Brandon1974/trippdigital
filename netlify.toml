[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "./"

[functions]
  included_files = ["data/*.json"]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "npm run dev"

[build.environment]
  # Keys to ignore for secrets scanning (these are false positives)
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_PASSWORD,ANTHROPIC_API_KEY,BLOG_STORAGE_TOKEN,NETLIFY_SITE_ID"

# Netlify Functions are bundled from netlify/functions directory

