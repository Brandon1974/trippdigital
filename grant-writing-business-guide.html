<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Start a Grant Writing Business — Tripp Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0a0a; --panel:#141414; --panel2:#1c1c1c; --accent:#FF6B00; --green:#3CCB6F; --text:#f2f2f2; --dim:#9a9a9a; --border:#262626; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:60px;}
  .nav{background:rgba(10,10,10,0.95);border-bottom:1px solid var(--border);padding:0 20px;}
  .nav-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;height:56px;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:#fff;text-decoration:none;}
  .logo .accent{color:var(--accent);}
  .saved-tag{color:var(--dim);font-size:12px;}

  .wrap{max-width:900px;margin:0 auto;padding:24px 16px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:1px;margin-bottom:4px;}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px;}

  .progress-bar{background:var(--panel);border-radius:10px;height:10px;overflow:hidden;margin-bottom:24px;}
  .progress-fill{background:var(--accent);height:100%;transition:width 0.3s;}
  .progress-label{text-align:center;color:var(--dim);font-size:12px;margin-bottom:20px;}

  .step-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .step-header{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;}
  .step-num{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:14px;}
  .step-num.done{background:var(--accent);color:#000;}
  .step-title{flex:1;font-weight:600;font-size:15px;}
  .step-title.done{color:#666;text-decoration:line-through;}
  .step-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);flex-shrink:0;cursor:pointer;}
  .step-check.checked{background:var(--accent);}
  .step-body{padding:0 18px 18px 64px;display:none;}
  .step-body.open{display:block;}
  .step-body p{color:#ccc;font-size:13px;line-height:1.6;margin-bottom:10px;}
  .example-box{background:#0a0a0a;border-left:3px solid var(--accent);border-radius:6px;padding:12px 14px;margin:10px 0;font-size:13px;color:#bbb;}
  .example-box strong{color:var(--accent);}
  .step-link{display:inline-block;background:var(--panel2);color:var(--accent);border:1px solid var(--accent);padding:8px 16px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600;margin-top:8px;}
  .notes-field{width:100%;background:#0a0a0a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px;font-size:13px;min-height:60px;margin-top:10px;font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<nav class="nav"><div class="nav-inner">
  <a href="#" class="logo">TRIPP <span class="accent">DIGITAL</span></a>
  <span class="saved-tag" id="savedTag">Progress saved</span>
</div></nav>

<div class="wrap">
  <h1>How to Start a Grant Writing Business</h1>
  <p class="sub">Work through each step at your own pace. Your progress and notes save automatically.</p>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
  <div class="progress-label" id="progressLabel">0 of 10 steps complete</div>

  <div id="stepList"></div>
</div>

<script>
  const STORAGE_KEY = 'grant_writing_guide_progress';

  let steps = [
    { title: "Understand what grant writers actually do", done: false, notes: "",
      body: `<p>A grant writer researches funding opportunities and writes proposals on behalf of nonprofits, schools, and small businesses to help them win grant money. You're paid whether or not the grant is won — most charge $500-$3,000 per proposal, or a monthly retainer.</p>
      <div class="example-box"><strong>Example:</strong> A local food bank needs $15,000 for a new refrigeration unit. They hire you to write the grant proposal for $1,200 flat fee.</div>` },

    { title: "Pick your niche", done: false, notes: "",
      body: `<p>Don't try to write grants for everyone. Pick 1-2 niches where you have some natural connection or interest — nonprofits, schools, churches, or small business grants are all good starting points.</p>
      <div class="example-box"><strong>Example:</strong> If you have daycare experience, target early childhood education grants. If you garden, target agricultural/community garden grants.</div>` },

    { title: "Set up your business basics", done: false, notes: "",
      body: `<p>You don't need an LLC to start, but you do need a way to get paid and a simple way to look professional.</p>
      <div class="example-box"><strong>Example setup:</strong> A free Google Voice number, a simple one-page website (or even just a LinkedIn profile), and a PayPal or Stripe account to invoice clients.</div>
      <a href="https://www.stripe.com" target="_blank" rel="noopener noreferrer" class="step-link">Set up Stripe →</a>` },

    { title: "Learn where the grants actually are", done: false, notes: "",
      body: `<p>Grants.gov is the main federal database. Most states also have their own grant portals, and private foundations list opportunities on their own websites.</p>
      <div class="example-box"><strong>Example:</strong> Search Grants.gov for "community garden" and you'll find active USDA grants your future clients could apply for.</div>
      <a href="https://www.grants.gov" target="_blank" rel="noopener noreferrer" class="step-link">Browse Grants.gov →</a>` },

    { title: "Write one practice proposal", done: false, notes: "",
      body: `<p>Before you pitch anyone, write one full practice proposal for a fictional or real local nonprofit. This becomes your portfolio sample.</p>
      <div class="example-box"><strong>Example:</strong> Pick a real grant listed on Grants.gov and write a mock proposal responding to it — even if you never submit it, it proves you can do the work.</div>` },

    { title: "Find your first client", done: false, notes: "",
      body: `<p>Start local. Nonprofits, churches, and small community organizations are the easiest first clients because they often don't have in-house grant writers.</p>
      <div class="example-box"><strong>Example:</strong> Search "[your city] nonprofits" on Google, find 10 small organizations, and reach out offering a free 15-minute consultation to review their current funding situation.</div>` },

    { title: "Price your services", done: false, notes: "",
      body: `<p>Common pricing models: flat fee per proposal ($500-$3,000 depending on complexity), hourly ($30-$75/hr), or a retainer for ongoing work ($500-$2,000/month).</p>
      <div class="example-box"><strong>Example:</strong> For your first 2-3 clients, charge a lower flat fee ($400-$600) to build your portfolio and testimonials, then raise your rates.</div>` },

    { title: "Write and submit your first real proposal", done: false, notes: "",
      body: `<p>Use the practice proposal you wrote in Step 5 as your template. Adjust it to fit the real client's mission, need, and the specific grant's requirements.</p>
      <div class="example-box"><strong>Example:</strong> Always follow the funder's exact formatting rules — font size, page limits, required attachments. Many proposals get rejected for formatting alone, before anyone reads the content.</div>` },

    { title: "Ask for referrals and reviews", done: false, notes: "",
      body: `<p>After you deliver (win or not), ask your client for a written testimonial and if they know anyone else who might need grant writing help.</p>
      <div class="example-box"><strong>Example:</strong> "Would you be willing to write a short testimonial about working together? And do you know any other organizations that might need help with grants?"</div>` },

    { title: "Scale to a steady client pipeline", done: false, notes: "",
      body: `<p>Once you have 3-5 happy clients, focus on repeatable outreach: a simple website with your testimonials, LinkedIn posts about grants you've helped win, and consistent outreach to new nonprofits.</p>
      <div class="example-box"><strong>Example:</strong> Set a goal of reaching out to 5 new potential clients every week, even once you're busy — this keeps your pipeline full instead of feast-or-famine.</div>` }
  ];

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(steps));
  }
  function load(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{
        const saved = JSON.parse(raw);
        saved.forEach((s,i)=>{ if(steps[i]){ steps[i].done = s.done; steps[i].notes = s.notes || ""; steps[i].open = s.open; } });
      }catch(e){}
    }
  }

  function renderSteps(){
    document.getElementById('stepList').innerHTML = steps.map((s,i)=>`
      <div class="step-card">
        <div class="step-header" onclick="toggleOpen(${i})">
          <div class="step-num ${s.done?'done':''}">${i+1}</div>
          <div class="step-title ${s.done?'done':''}">${s.title}</div>
          <div class="step-check ${s.done?'checked':''}" onclick="event.stopPropagation();toggleDone(${i})"></div>
        </div>
        <div class="step-body ${s.open?'open':''}" id="body-${i}">
          ${s.body}
          <textarea class="notes-field" placeholder="Your notes for this step..." onchange="updateNotes(${i}, this.value)">${s.notes||''}</textarea>
        </div>
      </div>`).join('');
    updateProgress();
  }

  function toggleOpen(i){ steps[i].open = !steps[i].open; save(); renderSteps(); }
  function toggleDone(i){ steps[i].done = !steps[i].done; save(); renderSteps(); }
  function updateNotes(i,val){ steps[i].notes = val; save(); }
  function updateProgress(){
    const doneCount = steps.filter(s=>s.done).length;
    document.getElementById('progressFill').style.width = (doneCount/10*100)+'%';
    document.getElementById('progressLabel').textContent = `${doneCount} of 10 steps complete`;
  }

  load();
  renderSteps();
</script>

    <!-- CHATBOT STYLES (inlined from styles.css for pages that do not link it) -->
    <style>
.chatbot-widget, .chatbot-toggle {
    --color-bg: #0a0a0a;
    --color-bg-secondary: #1a1a1a;
    --color-orange: #FF6B00;
    --color-orange-dark: #e55a00;
    --color-text: #ffffff;
    --color-text-muted: #b0b0b0;
    --font-heading: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --transition: all 0.3s ease;
}
/* CHATBOT STYLES */
.chatbot-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: var(--color-orange);
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
    transition: var(--transition);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-toggle svg {
    width: 28px;
    height: 28px;
    stroke: #000;
    flex-shrink: 0;
}

.chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 30px rgba(255, 107, 0, 0.6);
}

.chatbot-toggle.hidden {
    display: none;
}

.chatbot-widget {
    position: fixed;
    bottom: 100px;
    right: 30px;
    width: 400px;
    max-width: 90vw;
    height: 600px;
    background-color: var(--color-bg-secondary);
    border: 2px solid var(--color-orange);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    z-index: 998;
    animation: slideUp 0.3s ease;
    display: none;
}

.chatbot-widget.open {
    display: flex;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chatbot-header {
    background-color: var(--color-orange);
    color: #000;
    padding: 15px 20px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
}

.chatbot-header h3 {
    font-size: 1.1rem;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.chatbot-close {
    background: none;
    border: none;
    color: #000;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.chatbot-close:hover {
    transform: scale(1.2);
}

.chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.chatbot-messages::-webkit-scrollbar {
    width: 6px;
}

.chatbot-messages::-webkit-scrollbar-track {
    background: var(--color-bg);
    border-radius: 10px;
}

.chatbot-messages::-webkit-scrollbar-thumb {
    background: var(--color-orange);
    border-radius: 10px;
}

.chat-message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-message.user {
    justify-content: flex-end;
}

.chat-message.assistant {
    justify-content: flex-start;
}

.chat-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 0.95rem;
}

.chat-message.user .chat-bubble {
    background-color: var(--color-orange);
    color: #000;
    font-weight: 500;
}

.chat-message.assistant .chat-bubble {
    background-color: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-bg-secondary);
}

.chat-message.system .chat-bubble {
    background-color: transparent;
    color: var(--color-text-muted);
    text-align: center;
    font-size: 0.85rem;
}

.chatbot-input-area {
    padding: 15px;
    border-top: 1px solid var(--color-bg);
}

.chatbot-input-area form {
    display: flex;
    gap: 10px;
}

.chatbot-input-area input {
    flex: 1;
    padding: 10px 15px;
    background-color: var(--color-bg);
    border: 1px solid var(--color-bg-secondary);
    border-radius: 6px;
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    transition: var(--transition);
}

.chatbot-input-area input:focus {
    outline: none;
    border-color: var(--color-orange);
}

.chatbot-input-area input::placeholder {
    color: var(--color-text-muted);
}

.chatbot-send {
    width: 40px;
    height: 40px;
    background-color: var(--color-orange);
    border: none;
    border-radius: 6px;
    color: #000;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-weight: 700;
}

.chatbot-send:hover {
    background-color: var(--color-orange-dark);
    transform: scale(1.05);
}

.chatbot-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.loading-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
}

.loading-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--color-orange);
    animation: bounce 1.4s infinite;
}

.loading-dot:nth-child(1) { animation-delay: 0s; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
    </style>

    <!-- CHATBOT WIDGET -->
    <div id="chatbotWidget" class="chatbot-widget">
        <div class="chatbot-header">
            <h3>Tripp Digital Assistant</h3>
            <button id="closeChatbot" class="chatbot-close">&times;</button>
        </div>
        <div id="chatMessages" class="chatbot-messages"></div>
        <div class="chatbot-input-area">
            <form id="chatForm">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="Ask about our services, products, or anything else..."
                    autocomplete="off"
                >
                <button type="submit" class="chatbot-send">→</button>
            </form>
        </div>
    </div>

    <!-- CHATBOT TOGGLE BUTTON -->
    <button id="chatbotToggle" class="chatbot-toggle" title="Chat with us">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" width="28" height="28"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <script src="chatbot.js"></script>
</body>
</html>
